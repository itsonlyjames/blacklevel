<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(16% 0.01 60);--ink:oklch(92% 0.02 80);--dim:oklch(48% 0.02 70);--accent:oklch(78% 0.12 65)}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk';overflow:hidden}
.time{position:absolute;left:120px;top:90px;font-family:'Instrument Serif';font-size:160px;line-height:1}
.date{position:absolute;left:126px;top:260px;font-size:28px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.apps{position:absolute;left:120px;top:440px;display:flex;flex-wrap:wrap;gap:20px 56px;width:1680px}
.app{font-family:'Instrument Serif';font-size:64px;color:var(--dim)}
.app.f{color:var(--ink)}
.inputs{position:absolute;left:120px;bottom:100px;display:flex;gap:48px;font-size:28px;color:var(--dim)}
</style></head><body>
<div class="time">7:42</div><div class="date">Thursday 30 October</div>
<div class="apps">
<div class="app f">Netflix</div><div class="app">YouTube</div><div class="app">Plex</div><div class="app">Spotify</div><div class="app">Kayo</div><div class="app">Binge</div><div class="app">ABC iview</div><div class="app">SBS</div><div class="app">9Now</div><div class="app">10play</div><div class="app">7plus</div><div class="app">Optus Sport</div><div class="app">Prime Video</div>
</div>
<div class="inputs"><div>HDMI 1 · SHIELD</div><div>HDMI 2</div><div>HDMI 3</div><div>HDMI 4</div><div>Settings</div></div>
</body></html>
