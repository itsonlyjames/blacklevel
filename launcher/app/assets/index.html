<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Home</title>
<style>
@font-face{font-family:Display;src:url(fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Text;src:url(fonts/HankenGrotesk.ttf);font-weight:100 900}
:root{
  --bg:oklch(13% 0.008 60);
  --ink:oklch(90% 0.025 80);
  --dim:oklch(46% 0.018 70);
  --faint:oklch(30% 0.012 65);
  --accent:oklch(74% 0.13 58);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Text;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;transition:opacity 2.4s var(--ease),transform 6s linear}
body.idle #stage{opacity:.32}

.clock{position:absolute;left:128px;top:96px}
.time{font-family:Display;font-size:184px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.date{margin-top:22px;margin-left:6px;font-size:30px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* apps: a dial, focused item anchored at the left edge */
#apps{position:absolute;left:0;right:0;top:540px;height:220px;overflow:hidden}
#track{position:absolute;left:128px;top:0;display:flex;align-items:baseline;gap:72px;white-space:nowrap;transition:transform .45s var(--ease)}
.app{font-family:Display;font-size:100px;line-height:1.5;color:var(--dim);transition:color .3s,opacity .45s var(--ease)}
.app.past{opacity:0}
.app.sel{color:var(--ink)}

/* focus marker: an accent hairline grows under the selected thing */
.app::after,.inp::after{content:"";display:block;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);opacity:0;transform-origin:0 50%;transition:transform .4s var(--ease),opacity .2s}
.app::after{margin-top:-14px}
.inp::after{margin-top:12px}
.app.sel::after,.inp.sel::after{transform:scaleX(1);opacity:1}

#inputs{position:absolute;left:128px;right:128px;bottom:150px;display:flex;align-items:baseline;gap:64px}
.inp{font-size:40px;font-weight:500;color:var(--dim);transition:color .3s}
.inp small{font-size:24px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-left:14px}
.inp.sel{color:var(--ink)}
.inp.settings{margin-left:auto}
</style></head>
<body>
<div id="stage">
  <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <div id="apps"><div id="track"></div></div>
  <div id="inputs"></div>
</div>
<script>
const B = window.Launcher || {
  apps:()=>JSON.stringify(["Netflix","YouTube","Plex","Spotify","Kayo","Binge","ABC iview","SBS On Demand","9Now","10play","7plus","Optus Sport","Prime Video"].map(l=>({pkg:l,label:l}))),
  inputs:()=>JSON.stringify([{id:"hdmi1",label:"SHIELD",sub:"HDMI 1"},{id:"hdmi2",label:"HDMI 2"},{id:"hdmi3",label:"HDMI 3"},{id:"hdmi4",label:"HDMI 4"}]),
  launch:p=>console.log("launch",p), input:i=>console.log("input",i), settings:()=>console.log("settings")
};

// most recently opened first, remembered locally
const mru = (()=>{try{return JSON.parse(localStorage.mru||"[]")}catch(e){return[]}})();
const rank = p => { const i = mru.indexOf(p); return i < 0 ? 1e3 : i };
let apps = JSON.parse(B.apps()).sort((a,b)=>rank(a.pkg)-rank(b.pkg));
let inputs = JSON.parse(B.inputs()).concat([{id:"__settings",label:"Settings"}]);

const track = document.getElementById('track'), inRow = document.getElementById('inputs');
let row = 0, ai = 0, ii = 0;

function build(){
  track.innerHTML = apps.map(a=>`<div class="app">${a.label}</div>`).join('');
  inRow.innerHTML = inputs.map(x=>`<div class="inp${x.id==='__settings'?' settings':''}">${x.label}${x.sub?`<small>${x.sub}</small>`:''}</div>`).join('');
}
function render(){
  const els = track.children;
  [...els].forEach((e,i)=>{e.classList.toggle('sel',row===0&&i===ai);e.classList.toggle('past',i<ai)});
  track.style.transform = `translateX(${-els[ai].offsetLeft}px)`;
  [...inRow.children].forEach((e,i)=>e.classList.toggle('sel',row===1&&i===ii));
}
function activate(){
  if(row===0){ const p = apps[ai].pkg; const m = mru.filter(x=>x!==p); m.unshift(p); try{localStorage.mru=JSON.stringify(m)}catch(e){} B.launch(p); }
  else { const x = inputs[ii]; x.id==='__settings' ? B.settings() : B.input(x.id); }
}

document.addEventListener('keydown',e=>{
  wake();
  switch(e.key){
    case 'ArrowLeft': row===0 ? ai=Math.max(0,ai-1) : ii=Math.max(0,ii-1); break;
    case 'ArrowRight': row===0 ? ai=Math.min(apps.length-1,ai+1) : ii=Math.min(inputs.length-1,ii+1); break;
    case 'ArrowDown': row=1; break;
    case 'ArrowUp': row=0; break;
    case 'Enter': activate(); break;
    default: return;
  }
  e.preventDefault(); render();
});

// clock
function tick(){
  const d = new Date();
  document.getElementById('time').textContent = d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).replace(/\s?[ap]m/i,'');
  document.getElementById('date').textContent = d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
}
tick(); setInterval(tick, 5000);

// OLED care: dim after a minute idle, and drift the whole stage a few px every minute
let idleT; const stage = document.getElementById('stage');
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(()=>document.body.classList.add('idle'), 60000); }
setInterval(()=>{ stage.style.transform = `translate(${Math.round(Math.random()*16-8)}px,${Math.round(Math.random()*16-8)}px)`; }, 60000);

// called by the app when HDMI device names arrive (they load in the background)
window.refreshInputs = () => { inputs = JSON.parse(B.inputs()).concat([{id:"__settings",label:"Settings"}]); ii = Math.min(ii, inputs.length-1); build(); render(); };

// called by the app when it returns to the foreground
window.refresh = () => { apps = JSON.parse(B.apps()).sort((a,b)=>rank(a.pkg)-rank(b.pkg)); build(); ai=0; ii=0; row=0; render(); wake(); };
document.fonts.ready.then(()=>{ build(); render(); wake(); });
</script>
</body></html>
