<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Home</title>
<style>
@font-face{font-family:Display;src:url(fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Text;src:url(fonts/HankenGrotesk.ttf);font-weight:100 900}
:root{
  --bg:oklch(13% 0.008 60);
  --ink:oklch(90% 0.025 80);
  --dim:oklch(46% 0.018 70);
  --faint:oklch(30% 0.012 65);
  --accent:oklch(74% 0.13 58);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Text;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
::-webkit-scrollbar{display:none}
/* dims gently over 4s, wakes in half a second on any key; the drift eases rather than lurching */
#stage{position:absolute;inset:0;transition:opacity .5s var(--ease),transform 8s ease-in-out}
body.idle #stage{opacity:.32;transition:opacity 4s ease-in-out,transform 8s ease-in-out}

.clock{position:absolute;left:128px;top:96px}
.time{font-family:Display;font-size:184px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.date{margin-top:22px;margin-left:6px;font-size:30px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* now playing: across from the clock, the cover on the page margin and the words set towards it.
   The cover's own colours bleed faintly into the room behind it; paused, it falls back into the warm grey. */
#np{position:absolute;right:128px;top:110px;display:flex;align-items:center;gap:44px;opacity:0;transform:translateY(-12px);transition:opacity .5s var(--ease),transform .7s var(--ease)}
#np.on{opacity:1;transform:none}
body.noplaying #np{display:none}
#np .txt{display:flex;flex-direction:column;align-items:flex-end;text-align:right;min-width:0}
#np .src{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#np .ttl{margin-top:16px;max-width:620px;font-family:Display;font-size:64px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .5s}
#np .who{margin-top:2px;max-width:620px;font-size:30px;font-weight:500;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .bar{margin-top:22px;width:260px;height:3px;border-radius:2px;background:var(--faint);overflow:hidden}
#np .bar i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
#np.paused .ttl{color:var(--dim)}
#np.paused .bar i{background:var(--dim)}
/* four bars that dance while it plays and lie down when it stops */
.eq{display:flex;align-items:flex-end;gap:3px;height:20px}
.eq b{width:4px;height:100%;border-radius:1px;background:var(--accent);transform-origin:50% 100%;animation:eq .9s ease-in-out infinite alternate}
.eq b:nth-child(2){animation-duration:.7s;animation-delay:-.4s}
.eq b:nth-child(3){animation-duration:1.1s;animation-delay:-.2s}
.eq b:nth-child(4){animation-duration:.8s;animation-delay:-.6s}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
#np.paused .eq b{animation:none;transform:scaleY(.2);background:var(--dim)}
#np .cover{position:relative;flex:none;width:172px;height:172px}
#np .cover .ph{position:absolute;inset:0;border-radius:12px;background:var(--faint);font:400 96px/172px Display;text-align:center;color:var(--dim)}
#np .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:0;transform:scale(.96);transition:opacity .6s var(--ease),transform .7s var(--ease),filter .6s var(--ease)}
#np .cover img{z-index:1}
#np .cover img.glow{z-index:0;inset:-30%;width:160%;height:160%;border-radius:50%;filter:blur(48px) saturate(1.5);transform:none}
#np .cover img.on{opacity:1;transform:none}
#np .cover img.glow.on{opacity:.32}
#np.paused .cover img:not(.glow){filter:grayscale(1) sepia(.35) brightness(.5)}
#np.paused .cover img.glow.on{opacity:0}

/* apps: a dial, focused item anchored at the left edge */
#apps{position:absolute;left:0;right:0;top:540px;height:220px;overflow:hidden}
#track{position:absolute;left:128px;top:0;display:flex;align-items:baseline;gap:72px;white-space:nowrap;transition:transform .45s var(--ease)}
.app{font-family:Display;font-size:var(--app-size,100px);line-height:1.5;color:var(--dim);transition:color .3s,opacity .45s var(--ease)}
.app.past{opacity:0}
.app.sel{color:var(--ink)}
.app.moving{color:var(--accent)}

/* focus marker: an accent hairline grows under the selected thing */
.app::after,.inp::after,.opt .val::after{content:"";display:block;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);opacity:0;transform-origin:0 50%;transition:transform .25s var(--ease),opacity .15s}
.app::after{margin-top:-14px}
.inp::after{margin-top:12px}
.opt .val::after{margin-top:10px}
.app.sel::after,.inp.sel::after,.opt.sel .val::after{transform:scaleX(1);opacity:1;transition:transform .4s var(--ease),opacity .2s}

#inputs{position:absolute;left:128px;right:128px;bottom:150px;display:flex;align-items:baseline;gap:64px;transition:opacity .3s var(--ease) .15s}
.inp{font-size:40px;font-weight:500;color:var(--dim);transition:color .3s}
.inp small{font-size:24px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-left:14px}
.inp.sel{color:var(--ink)}
.inp.settings{margin-left:auto}

/* moving an app: the inputs make way for a hint in the same place */
#movehint{position:absolute;left:128px;bottom:150px;font-size:24px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);opacity:0;transition:opacity .15s var(--ease)}
body.moving #inputs{opacity:0;transition:opacity .15s var(--ease)}
body.moving #movehint{opacity:1;transition:opacity .3s var(--ease) .15s}

/* vertical layout: clock and inputs down the left, apps in one column on the right.
   The column starts level with the clock and runs to the bottom of the screen, fading out; names keep the horizontal size. */
body.vertical #apps{left:960px;right:128px;top:82px;bottom:0;height:auto}
body.vertical #apps.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 140px),transparent);mask-image:linear-gradient(#000 calc(100% - 140px),transparent)}
body.vertical #apps.scrolled{-webkit-mask-image:linear-gradient(transparent,#000 120px);mask-image:linear-gradient(transparent,#000 120px)}
body.vertical #apps.more.scrolled{-webkit-mask-image:linear-gradient(transparent,#000 120px,#000 calc(100% - 140px),transparent);mask-image:linear-gradient(transparent,#000 120px,#000 calc(100% - 140px),transparent)}
body.vertical #track{left:0;flex-direction:column;align-items:flex-start;gap:0;max-width:100%}
body.vertical .app{line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis}
body.vertical .app.past{opacity:1}
body.vertical .app::after{margin-top:-10px}
body.vertical #inputs{right:auto;width:640px;flex-direction:column;align-items:flex-start;gap:20px}
body.vertical .inp::after{margin-top:6px}
body.vertical .inp.settings{margin-left:0;margin-top:28px}
/* the apps column has the top right, so now playing tucks in under the date, small enough to clear six inputs */
body.vertical #np{left:134px;right:auto;top:340px;flex-direction:row-reverse;gap:28px}
body.vertical #np .txt{align-items:flex-start;text-align:left}
body.vertical #np .src{flex-direction:row-reverse;font-size:18px;gap:12px}
body.vertical #np .eq{height:16px}
body.vertical #np .ttl{max-width:600px;font-size:40px;margin-top:6px}
body.vertical #np .who{max-width:600px;font-size:24px;margin-top:0}
body.vertical #np .bar{margin-top:12px;width:200px}
body.vertical #np .cover{width:104px;height:104px}
body.vertical #np .cover .ph{font-size:56px;line-height:104px}

/* icons: a contact sheet of the apps' own icons, close together, with the focused app's name as the headline.
   At rest the icons fall into the room's warm grey; only the focused one keeps its colour. */
.app img,.app .ph,#headline{display:none}
body.icons #apps{top:640px;height:160px}
body.icons #track{align-items:flex-start;gap:24px}
body.icons .app{font-size:0;line-height:0;transition:opacity .45s var(--ease),transform .35s var(--ease)}
body.icons .app.past{opacity:1}
body.icons .app .nm{display:none}
body.icons .app img,body.icons .app .ph{display:block;width:112px;height:112px;border-radius:var(--icon-radius,0);filter:grayscale(1) sepia(.35) brightness(.42);transition:filter .5s var(--ease)}
body.icons .app .ph{background:var(--faint);font:600 48px/112px Text;text-align:center;color:var(--ink)}
body.icons .app.sel img,body.icons .app.sel .ph,body.nofade .app img,body.nofade .app .ph{filter:none}
body.icons .app::after{margin-top:20px}
body.icons .app.moving{transform:translateY(-16px)}
body.icons #headline{display:block;position:absolute;left:128px;top:420px;width:1664px;height:180px;transition:opacity .3s var(--ease)}
#headline span{position:absolute;left:0;bottom:0;font-family:Display;font-size:150px;line-height:1;white-space:nowrap;opacity:0;transform:translateX(32px);transition:opacity .15s var(--ease),transform .5s var(--ease),color .3s}
/* names wait to the right and leave to the left, so the headline moves with ◀ ▶ like the strip; the old one clears fast */
#headline span.l{transform:translateX(-32px)}
#headline span.on{opacity:1;transform:none;transition:opacity .35s var(--ease),transform .5s var(--ease),color .3s}
body.away #headline{opacity:.4}
body.moving #headline span{color:var(--accent)}
/* tiles: the icons as rounded squares, each named in small capitals beneath, so the row needs no headline.
   The focused tile lifts and its label comes up to full strength. The vertical layout keeps its icon column. */
body.tiles:not(.vertical) #headline{display:none}
body.tiles:not(.vertical) #apps{top:540px;height:300px}
body.tiles:not(.vertical) #track{gap:40px;padding-top:16px}
body.tiles:not(.vertical) .app{display:flex;flex-direction:column;align-items:center}
body.tiles:not(.vertical) .app img,body.tiles:not(.vertical) .app .ph{width:136px;height:136px;border-radius:30%;transition:filter .5s var(--ease),transform .25s var(--ease)}
body.tiles:not(.vertical) .app .ph{line-height:136px}
body.tiles:not(.vertical) .app.sel img,body.tiles:not(.vertical) .app.sel .ph{transform:translateY(-14px)}
body.tiles:not(.vertical) .app .nm{display:block;margin-top:22px;font:600 20px/1 Text;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--dim);transition:color .3s}
body.tiles:not(.vertical) .app.sel .nm{color:var(--ink)}
body.tiles:not(.vertical) .app.moving .nm{color:var(--app-accent,var(--accent))}
body.tiles:not(.vertical) .app::after{align-self:stretch;margin-top:18px}
/* vertical: one column of icons, the focused app's name set out to the right of its icon */
body.vertical.icons #headline{display:none}
body.vertical.icons #apps{top:82px;height:auto}
body.vertical.icons #track{gap:24px;padding-top:16px}
body.vertical.icons .app{position:relative;overflow:visible}
body.vertical.icons .app .nm{display:block;position:absolute;left:148px;top:56px;font-size:var(--app-size,100px);line-height:1;opacity:0;transform:translate(-12px,-55%);transition:opacity .3s var(--ease),transform .4s var(--ease)}
body.vertical.icons .app.sel .nm{opacity:1;transform:translate(0,-55%)}
body.vertical.icons .app::after{margin-top:14px;width:112px}

/* customise panel: covers the stage, same type, same focus hairline */
#panel{position:absolute;inset:0;z-index:1;padding:96px 128px;display:flex;flex-direction:column;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s .25s}
body.panel #panel{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
/* opening, the title then the sections rise into place; closing is a quicker fade */
#panel h2,.sections{transform:translateY(16px);transition:transform .25s var(--ease)}
body.panel #panel h2{transform:none;transition:transform .5s var(--ease)}
body.panel .sections{transform:none;transition:transform .5s var(--ease) .05s}
body.panel #stage{opacity:0;transition:opacity .35s var(--ease)}
#panel h2{font-family:Display;font-weight:400;font-size:120px;line-height:1;margin-bottom:64px}
/* sections down the left, the open section's options on the right, split by a faint rule that runs from the title to the hints.
   The panel only shows while you're in it, so the rule is no burn-in risk. */
.sections{flex:1;margin-bottom:96px;display:grid;grid-template-columns:360px 1fr}
#tabs{border-right:1px solid oklch(21% .01 62)}
#opts{padding-left:80px}
.tab{font-size:40px;font-weight:500;color:var(--dim);margin-bottom:18px;transition:color .3s}
.tab.cur{color:var(--ink)}
.tab span{display:inline-block}
.tab span::after{content:"";display:block;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);opacity:0;transform-origin:0 50%;transition:transform .25s var(--ease),opacity .15s;margin-top:10px}
.tab.sel span::after{transform:scaleX(1);opacity:1;transition:transform .4s var(--ease),opacity .2s}
.opt{display:flex;align-items:baseline;font-size:40px;font-weight:500;color:var(--dim);margin-bottom:18px;transition:color .3s}
.opt .lbl{width:480px}
.opt .val{display:inline-block}
.opt .arr{color:var(--faint);opacity:0;transition:opacity .2s}
.opt .arr.l{margin-right:28px}
.opt .arr.r{margin-left:28px}
.opt.sel{color:var(--ink)}
.opt.sel .arr{opacity:1}
.opt.version,.opt.now{margin-top:28px}
.opt.version .arr,.opt.now .arr{visibility:hidden}
.opt .msg{margin-left:28px;font-size:28px;color:var(--faint)}
#panel .hint{position:absolute;left:128px;bottom:96px;font-size:24px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
/* [5] hidden until the fonts are in, then everything settles in at once */
body.pre #stage{visibility:hidden}
/* reduced motion: nothing slides, grows or lifts; fades, colour, the idle dim and the burn-in drift stay */
@media (prefers-reduced-motion:reduce){
  #track{transition:none}
  .app::after,.inp::after,.opt .val::after,.tab span::after,#headline span,#panel h2,.sections,body.icons .app.moving,body.tiles .app.sel img,body.tiles .app.sel .ph,#np,#np .cover img{transform:none!important}
  .eq b{animation:none;transform:scaleY(.6)}
  body.vertical.icons .app .nm{transform:translate(0,-55%)!important}
}
</style><link rel="stylesheet" href="wordclock.css"></head>
<body class="pre">
<div id="stage">
  <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <div id="np"><div class="txt"><div class="src"><i class="eq"><b></b><b></b><b></b><b></b></i><span></span></div><div class="ttl"></div><div class="who"></div><div class="bar"><i></i></div></div><div class="cover"><div class="ph"></div></div></div>
  <div id="headline"></div>
  <div id="apps"><div id="track"></div></div>
  <div id="inputs"></div>
  <div id="movehint"></div>
</div>
<div id="panel"><h2>Customise</h2><div class="sections"><div id="tabs"></div><div id="opts"></div></div><div class="hint" id="phint"></div></div>
<script src="wordclock.js"></script>
<script>
const EASE = 'cubic-bezier(.22,1,.36,1)', still = matchMedia('(prefers-reduced-motion: reduce)');
const B = window.Launcher || {
  apps:()=>JSON.stringify(["Netflix","YouTube","Plex","Spotify","Kayo","Binge","ABC iview","SBS On Demand","9Now","10play","7plus","Optus Sport","Prime Video"].map(l=>({pkg:l,label:l}))),
  inputs:()=>JSON.stringify([{id:"hdmi1",label:"SHIELD",sub:"HDMI 1"},{id:"hdmi2",label:"HDMI 2"},{id:"hdmi3",label:"HDMI 3"},{id:"hdmi4",label:"HDMI 4"}]),
  launch:p=>console.log("launch",p), input:i=>console.log("input",i), settings:()=>console.log("settings"),
  nowPlaying:()=>JSON.stringify({title:"Make Me Feel",artist:"oskar med k",app:"Spotify",playing:true,position:62e3,duration:214e3,speed:1,at:Date.now(),
    art:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><defs><linearGradient id="g" x2="1" y2="1"><stop offset="0" stop-color="#e86a3a"/><stop offset="1" stop-color="#3a2a6e"/></linearGradient></defs><rect width="10" height="10" fill="url(#g)"/><circle cx="6.5" cy="4" r="2" fill="#f4c27a"/></svg>')})
};

// launcher settings, remembered locally; each option's first choice is the default
const OPTS = [
  {key:"layout", label:"Layout", choices:[["horizontal","Horizontal"],["vertical","Vertical"]]},
  {key:"view", label:"Show as", choices:[["names","Names"],["icons","Icons"],["tiles","Tiles"]]},
  {key:"shape", label:"Shape", choices:[["square","Square"],["rounded","Rounded"],["circle","Circle"]]},
  {key:"fade", label:"Fade others", choices:[["on","On"],["off","Off"]]},
  {key:"order", label:"Order", choices:[["recent","Recently opened"],["custom","Your order"]]},
  {key:"names", label:"Length", choices:[["full","Full"],[12,"12 letters"],[10,"10 letters"],[8,"8 letters"]]},
  {key:"size", label:"Size", choices:[[100,"Medium"],[120,"Large"],[80,"Small"]]},
  {key:"clock", label:"Clock", choices:[["12","12-hour"],["24","24-hour"]]},
  {key:"idle", label:"When idle", choices:[["dim","Dim the screen"],["clock","Word clock"]]},
  {key:"dim", label:"After", choices:[[1,"1 minute"],[5,"5 minutes"],[15,"15 minutes"]]},
  {key:"dots", label:"Minute dots", choices:[["off","Off"],["on","On"]]},
  {key:"level", label:"Brightness", choices:[["medium","Medium"],["soft","Soft"],["bright","Bright"]]},
  {key:"playing", label:"Now playing", choices:[["on","On"],["off","Off"]]},
  {key:"updates", label:"Updates", choices:[["daily","Check daily"],["off","Off"]]},
];
const load = (k, d) => { try{return JSON.parse(localStorage[k]) ?? d}catch(e){return d} };
const save = (k, v) => { try{localStorage[k]=JSON.stringify(v)}catch(e){} };
const prefs = load('prefs', {});
const pref = k => { const o = OPTS.find(o=>o.key===k); return o.choices.some(c=>c[0]===prefs[k]) ? prefs[k] : o.choices[0][0]; };
const short = l => pref('names')==='full' || l.length <= pref('names') ? l : l.slice(0, pref('names')).trimEnd()+'…';
function applyPrefs(){
  document.documentElement.style.setProperty('--app-size', pref('size')+'px');
  document.body.classList.toggle('vertical', pref('layout')==='vertical'); scroll = 0;
  // tiles are icons with their names beneath, so they take everything the icons do
  document.body.classList.toggle('icons', pref('view')!=='names');
  document.body.classList.toggle('tiles', pref('view')==='tiles');
  document.body.classList.toggle('nofade', pref('fade')==='off');
  document.body.classList.toggle('noplaying', pref('playing')==='off');
  document.documentElement.style.setProperty('--icon-radius', {square:'0',rounded:'24%',circle:'50%'}[pref('shape')]);
  WordClock.set({dots:pref('dots')==='on', level:pref('level')});
  tick();
}

// app order: most recently opened first, or the order you set by holding OK on an app.
// Apps in neither list keep the bridge's order, after the rest.
let mru = load('mru', []), custom = load('order', []);
function arrange(list){
  const o = pref('order')==='custom' ? custom : mru;
  const rank = p => { const i = o.indexOf(p); return i < 0 ? 1e3 : i };
  return list.slice().sort((a,b)=>rank(a.pkg)-rank(b.pkg));
}
let apps = arrange(JSON.parse(B.apps()));
const extras = () => [{id:"__customise",label:"Customise",sub:latest?"Update available":null},{id:"__settings",label:"Settings"}];

// updates: once a day the app asks GitHub for a newer Blacklevel Home; Customise shows it and installs it
const current = B.version ? B.version() : '';
let latest = load('latest', null), updateMsg = '';
if(latest===current) latest = null;
function checkUpdate(force){
  if(!B.checkUpdate || (!force && (pref('updates')==='off' || Date.now()-load('checked',0) < 864e5))) return;
  save('checked', Date.now()); B.checkUpdate();
}
// called by the app: {latest} after a check (null when up to date), {message} while checking or installing
window.updateStatus = s => {
  if('latest' in s){ latest = s.latest; save('latest', latest); updateMsg = latest ? '' : 'Up to date'; }
  if(s.message) updateMsg = s.message;
  refreshInputs(); if(open) renderPanel();
};
function updateAction(){
  if(latest){ updateMsg = 'Starting…'; B.installUpdate(); }
  else { updateMsg = 'Checking…'; checkUpdate(true); }
  renderPanel();
}
setInterval(checkUpdate, 36e5);

let inputs = JSON.parse(B.inputs()).concat(extras());

const track = document.getElementById('track'), inRow = document.getElementById('inputs');
const appsEl = document.getElementById('apps');
let row = 0, ai = 0, ii = 0, pi = 0, open = false, scroll = 0, hold = null, moving = null;

// each app's own launcher icon from the app, fetched once per visit; a plain initial stands in where there isn't one
let icons = {};
const icon = a => {
  const src = icons[a.pkg] ?? (icons[a.pkg] = B.icon ? B.icon(a.pkg) : '');
  return src ? `<img src="${src}" alt="">` : `<div class="ph">${a.label[0]}</div>`;
};
const headline = document.getElementById('headline');
function build(){
  const v = pref('view')!=='names';
  track.innerHTML = apps.map(a=>`<div class="app">${v?icon(a):''}<span class="nm">${short(a.label)}</span></div>`).join('');
  headline.innerHTML = v ? apps.map(a=>`<span>${a.label}</span>`).join('') : '';
  inRow.innerHTML = inputs.map(x=>`<div class="inp${x.id==='__customise'?' settings':''}">${x.label}${x.sub?`<small>${x.sub}</small>`:''}</div>`).join('');
}
function render(){
  const els = track.children;
  [...els].forEach((e,i)=>{e.classList.toggle('sel',row===0&&i===ai);e.classList.toggle('moving',!!moving&&i===ai);e.classList.toggle('past',i<ai)});
  if(pref('layout')==='vertical'){
    // scroll only as far as needed to keep the selected app inside the page margin (the inputs' 150px);
    // the next one peeks out into the margin and fades off the bottom of the screen
    const e = els[ai], view = appsEl.clientHeight - 150;
    if(e.offsetTop < scroll) scroll = e.offsetTop;
    if(e.offsetTop + e.offsetHeight > scroll + view) scroll = e.offsetTop + e.offsetHeight - view;
    track.style.transform = `translateY(${-scroll}px)`;
    appsEl.classList.toggle('more', track.offsetHeight - scroll > appsEl.clientHeight + 1);
    appsEl.classList.toggle('scrolled', scroll > 0);
  } else if(pref('view')!=='names'){
    // the contact sheet holds still and only slides once focus nears its right-hand end
    track.style.transform = `translateX(${-Math.max(0, els[ai].offsetLeft - 1100)}px)`;
  } else track.style.transform = `translateX(${-els[ai].offsetLeft}px)`;
  [...headline.children].forEach((e,i)=>{ e.classList.toggle('on',i===ai); e.classList.toggle('l',i<ai); });
  document.body.classList.toggle('away', row===1);
  [...inRow.children].forEach((e,i)=>e.classList.toggle('sel',row===1&&i===ii));
}
function activate(){
  if(row===0){ const p = apps[ai].pkg; mru = [p, ...mru.filter(x=>x!==p)]; save('mru', mru); B.launch(p); }
  else { const x = inputs[ii]; x.id==='__customise' ? showPanel(true) : x.id==='__settings' ? B.settings() : B.input(x.id); }
}

// moving an app: ◀ ▶ swap it with its neighbour, OK keeps the new order, Back puts it back
const hintEl = document.getElementById('movehint');
// a swap rebuilds the row, so each of the pair slides from where it was, in step with the row
const at = i => [track.children[i].offsetLeft, track.children[i].offsetTop];
function slide(e, [x,y]){
  const [x1,y1] = at([...track.children].indexOf(e));
  if(!still.matches) e.animate([{translate:`${x-x1}px ${y-y1}px`},{translate:'0 0'}],{duration:450,easing:EASE});
}
function startMove(){
  moving = {ai, apps:apps.slice()};
  hintEl.innerHTML = `${pref('layout')==='vertical'?'▲ ▼':'◀ ▶'} move &nbsp;·&nbsp; OK to place &nbsp;·&nbsp; Back to cancel`;
  document.body.classList.add('moving'); render();
}
function endMove(keep){
  if(keep){ custom = apps.map(a=>a.pkg); save('order', custom); prefs.order = 'custom'; save('prefs', prefs); }
  else { apps = moving.apps; ai = moving.ai; build(); }
  moving = null; document.body.classList.remove('moving'); render();
}
function moveKey(k){
  const j = ai + (k==='ArrowLeft' ? -1 : k==='ArrowRight' ? 1 : 0);
  if(j!==ai && j>=0 && j<apps.length){
    const was = ai, a = at(ai), b = at(j);
    [apps[ai],apps[j]] = [apps[j],apps[ai]]; ai = j; build(); render();
    slide(track.children[j], a); slide(track.children[was], b);
  }
  else if(k==='Enter' && !hold) endMove(true); // not the key-repeat of the hold that started the move
  else if(k==='Escape') endMove(false);
}

// Customise: sections down the left, the open section's options on the right.
// ▲ ▼ pick a section, ▶ or OK goes into its options; there ◀ ▶ change a value and Back returns to the sections.
// Updates ends with one row for the version: OK checks now, or installs the update it found.
const TABS = [
  {label:"Apps", keys:["view","order"]},
  {label:"Names", keys:["names","size"]},
  {label:"Icons", keys:["shape","fade"]},
  {label:"Screen", keys:["layout","clock","playing"]},
  {label:"Idle", keys:["idle","dim","dots","level","now"]},
  {label:"Updates", keys:["updates","version"]},
];
const tabsEl = document.getElementById('tabs'), optsEl = document.getElementById('opts'), phint = document.getElementById('phint');
let ti = 0, inOpts = false;
const keys = () => TABS[ti].keys.filter(k=>k!=='version' || current);
// renderPanel() rebuilds the open section; selPanel() only moves focus, so the hairlines and arrows can animate
function renderPanel(){
  if(!tabsEl.children.length) tabsEl.innerHTML = TABS.map(t=>`<div class="tab"><span>${t.label}</span></div>`).join('');
  optsEl.innerHTML = keys().map(k=>{
    if(k==='now') return `<div class="opt now"><span class="lbl">Word clock</span><span class="arr l">‹</span><span class="val">Show now</span><span class="msg">Any button brings you back</span></div>`;
    if(k==='version') return `<div class="opt version"><span class="lbl">${latest?'Update':'Version'}</span><span class="arr l">‹</span><span class="val">${latest?`Install ${latest}`:current}</span><span class="msg">${updateMsg || (latest ? `You have ${current}` : 'OK to check now')}</span></div>`;
    const o = OPTS.find(o=>o.key===k);
    return `<div class="opt"><span class="lbl">${o.label}</span><span class="arr l">‹</span><span class="val">${o.choices.find(c=>c[0]===pref(o.key))[1]}</span><span class="arr r">›</span></div>`;
  }).join('');
  selPanel();
}
function selPanel(){
  [...tabsEl.children].forEach((e,i)=>{ e.classList.toggle('cur',i===ti); e.classList.toggle('sel',i===ti&&!inOpts); });
  [...optsEl.children].forEach((e,i)=>e.classList.toggle('sel',inOpts&&i===pi));
  phint.innerHTML = inOpts ? '▲ ▼ choose &nbsp;·&nbsp; ◀ ▶ change &nbsp;·&nbsp; Back to sections'
    : '▲ ▼ choose &nbsp;·&nbsp; ▶ open &nbsp;·&nbsp; Back to close &nbsp;·&nbsp; Hold OK on an app to move it';
}
// opens on Updates when there's one to install
function showPanel(on){ open = on; pi = 0; inOpts = false; ti = latest ? TABS.length-1 : 0; document.body.classList.toggle('panel', on); if(on) renderPanel(); }
function cycle(d){
  const k = keys()[pi];
  if(k==='version'){ if(d>0) updateAction(); return; }
  if(k==='now'){ if(d>0) WordClock.show(); return; }
  const o = OPTS.find(o=>o.key===k), i = o.choices.findIndex(c=>c[0]===pref(o.key));
  prefs[o.key] = o.choices[(i+d+o.choices.length)%o.choices.length][0];
  save('prefs', prefs);
  applyPrefs(); apps = arrange(apps); build(); render(); renderPanel(); wake();
  // the new value nudges in from the side it came from
  if(!still.matches) optsEl.children[pi].querySelector('.val').animate([{opacity:.3,transform:`translateX(${d*16}px)`},{opacity:1,transform:'none'}],{duration:250,easing:EASE});
}
function panelBack(){ if(inOpts){ inOpts = false; selPanel(); } else showPanel(false); }
function panelKey(k){
  if(k==='Escape'){ panelBack(); return true; }
  if(!inOpts) switch(k){
    case 'ArrowUp': if(ti>0){ ti--; renderPanel(); } return true;
    case 'ArrowDown': if(ti<TABS.length-1){ ti++; renderPanel(); } return true;
    case 'ArrowRight': case 'Enter': inOpts = true; pi = 0; break;
    case 'ArrowLeft': break;
    default: return false;
  } else switch(k){
    case 'ArrowUp': pi=Math.max(0,pi-1); break;
    case 'ArrowDown': pi=Math.min(keys().length-1,pi+1); break;
    case 'ArrowLeft': cycle(-1); return true;
    case 'ArrowRight': case 'Enter': cycle(1); return true;
    default: return false;
  }
  selPanel(); return true;
}
// called by the app on the remote's Back button
window.back = () => { if(WordClock.active) wake(); else if(moving) endMove(false); else if(open) panelBack(); };

document.addEventListener('keydown',e=>{
  // the word clock takes the first key and only goes, leaving everything as it was;
  // the repeats of a held OK that opened it don't close it again
  if(WordClock.active){ if(!e.repeat) wake(); e.preventDefault(); return; }
  wake();
  if(e.key!=='Enter'){ clearTimeout(hold); hold = null; }
  else if(e.repeat && !moving){ e.preventDefault(); return; }
  if(open){ if(panelKey(e.key)) e.preventDefault(); return; }
  // the vertical layout turns the remote a quarter: ▲ ▼ along a column, ◀ ▶ between them
  const v = pref('layout')==='vertical';
  const key = !v ? e.key : {ArrowUp:'ArrowLeft',ArrowDown:'ArrowRight',ArrowLeft:'ArrowDown',ArrowRight:'ArrowUp'}[e.key] || e.key;
  if(moving){ moveKey(key); e.preventDefault(); return; }
  switch(key){
    case 'ArrowLeft': row===0 ? ai=Math.max(0,ai-1) : ii=Math.max(0,ii-1); break;
    case 'ArrowRight': row===0 ? ai=Math.min(apps.length-1,ai+1) : ii=Math.min(inputs.length-1,ii+1); break;
    case 'ArrowDown': row=1; break;
    case 'ArrowUp': row=0; break;
    // apps open on release, so holding OK can pick one up to move instead
    case 'Enter': row===0 ? hold = hold || setTimeout(startMove, 600) : activate(); break;
    default: return;
  }
  e.preventDefault(); render();
});
document.addEventListener('keyup',e=>{
  if(e.key!=='Enter' || !hold) return;
  clearTimeout(hold); hold = null;
  if(!moving) activate();
});

// clock
function tick(){
  const d = new Date();
  document.getElementById('time').textContent = pref('clock')==='24'
    ? d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    : d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).replace(/\s?[ap]m/i,'');
  document.getElementById('date').textContent = d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
}
tick(); setInterval(tick, 5000);

// OLED care: after a minute idle, dim or show the word clock (over whatever was open, which stays as it was);
// and drift the whole stage a few px every minute
let idleT; const stage = document.getElementById('stage');
function wake(){ WordClock.hide(); document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(rest, pref('dim')*60000); }
function rest(){ pref('idle')==='clock' ? WordClock.show() : document.body.classList.add('idle'); }
setInterval(()=>{ stage.style.transform = `translate(${Math.round(Math.random()*16-8)}px,${Math.round(Math.random()*16-8)}px)`; }, 60000);

// now playing: the app sends what's playing whenever it changes (null when nothing is);
// the line under it runs on by itself between updates, so the page does no work while a song plays
const np = document.getElementById('np'), npTxt = np.querySelector('.txt'), npCover = np.querySelector('.cover');
const npFill = np.querySelector('.bar i'), EASE_OUT = 'cubic-bezier(.55,0,1,.45)';
let playing = null, npSwap = 0, npArtSwap = 0, npWait = null, npOut = [];
function npText(n){
  np.querySelector('.src span').textContent = (n.playing ? '' : 'Paused · ') + n.app;
  np.querySelector('.ttl').textContent = n.title;
  np.querySelector('.who').textContent = n.artist;
}
// a new cover fades up over the old one, which stays put underneath until it's covered; the glows cross over
function npArt(n){
  const swap = ++npArtSwap, old = [...npCover.querySelectorAll('img')];
  const drop = () => old.forEach(i=>{ i.classList.remove('on'); setTimeout(()=>i.remove(), 700); });
  if(!n.art){ npCover.querySelector('.ph').textContent = n.title[0]; drop(); return; }
  const imgs = ['glow',''].map(c=>Object.assign(new Image(), {className:c, alt:'', src:n.art}));
  Promise.all(imgs.map(i=>i.decode().catch(()=>{}))).then(()=>{
    if(swap!==npArtSwap) return;
    npCover.append(...imgs);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      imgs.forEach(i=>i.classList.add('on'));
      old.filter(i=>i.classList.contains('glow')).forEach(i=>i.classList.remove('on'));
      setTimeout(()=>{ npCover.querySelector('.ph').textContent = ''; old.forEach(i=>i.remove()); }, 750);
    }));
  });
}
function npBar(n){
  npFill.parentNode.style.visibility = n.duration ? '' : 'hidden';
  if(!n.duration) return;
  const pos = Math.min(n.duration, n.position + (n.playing ? (Date.now()-n.at)*n.speed : 0));
  npFill.style.transition = 'none'; npFill.style.transform = `scaleX(${pos/n.duration})`; npFill.offsetWidth;
  if(n.playing && n.speed > 0){ npFill.style.transition = `transform ${(n.duration-pos)/n.speed}ms linear`; npFill.style.transform = 'scaleX(1)'; }
}
const sameSong = (a, b) => a && b && a.title===b.title && a.artist===b.artist;
function npShow(n){
  const was = playing; playing = n;
  npOut.forEach(a=>a.cancel()); npOut = []; // a change that interrupts a swap starts from the words as they are
  np.classList.toggle('on', !!n);
  if(!n) return;
  np.classList.toggle('paused', !n.playing);
  if(!was || was.art!==n.art) npArt(n);
  if(!was || still.matches || sameSong(was, n)){ ++npSwap; npBar(n); npText(n); return; }
  // a new song: the old words and the line lift away together, then the new ones rise into their place
  // as the new cover settles. Each phase holds its end state, so nothing flashes back between them.
  const swap = ++npSwap, bar = npFill.parentNode;
  const out = npOut = [npTxt.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-8px)'}],{duration:220,easing:EASE_OUT,fill:'forwards'}),
               bar.animate([{opacity:1},{opacity:0}],{duration:220,easing:EASE_OUT,fill:'forwards'})];
  out[0].finished.then(()=>{
    if(swap!==npSwap) return;
    npText(playing); npBar(playing);
    npTxt.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:560,easing:EASE});
    bar.animate([{opacity:0},{opacity:1}],{duration:560,delay:120,easing:EASE,fill:'backwards'});
    out.forEach(a=>a.cancel()); npOut = [];
  }).catch(()=>{});
}
// Apps send a song change in pieces (the new title, then its cover and position), and skipping briefly stops
// the session. Wait for the pieces to land so the change happens once, and let a gap pass before hiding.
window.nowPlaying = n => {
  clearTimeout(npWait);
  if(!playing) return npShow(n);
  npWait = setTimeout(()=>npShow(n), !n ? 1500 : 250);
};
if(B.nowPlaying) nowPlaying(JSON.parse(B.nowPlaying()));

// called by the app when an HDMI input connects or drops, or device names arrive (they load in the background)
window.refreshInputs = () => { inputs = JSON.parse(B.inputs()).concat(extras()); ii = Math.min(ii, inputs.length-1); build(); render(); };

// coming home: the row snaps to the first app (no visible rewind), then the screen settles in from top to bottom
function enter(){
  document.body.classList.remove('pre');
  track.style.transition = 'none'; render(); track.offsetWidth; track.style.transition = '';
  if(!still.matches) ['.clock',...(playing?['#np']:[]),'#headline','#apps','#inputs'].forEach((s,i)=>document.querySelector(s).animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:600,delay:i*70,easing:EASE,fill:'backwards'}));
}

// called by the app when it returns to the foreground
window.refresh = () => {
  clearTimeout(hold); hold = null; moving = null; document.body.classList.remove('moving');
  icons = {}; apps = arrange(JSON.parse(B.apps())); build(); ai=0; ii=0; row=0; scroll=0; showPanel(false); enter(); wake();
  checkUpdate();
};
// called by the app when Home is pressed while already home: back to the first app, without reloading or re-entering
window.home = () => {
  clearTimeout(hold); hold = null; if(moving) endMove(false);
  ai=0; ii=0; row=0; showPanel(false); render(); wake();
};
applyPrefs();
document.fonts.ready.then(()=>{ build(); enter(); wake(); checkUpdate(); });
</script>
</body></html>
