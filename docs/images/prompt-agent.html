<!doctype html>
<html><head><meta charset="utf-8">
<!-- README header for "Prompt your agent". Render at 2x to prompt-agent.png (1760×400) with a transparent background; keep it PNG (WebP bands the glow). -->
<style>
@font-face{font-family:Display;src:url(../../launcher/app/assets/fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Text;src:url(../../launcher/app/assets/fonts/HankenGrotesk.ttf);font-weight:100 900}
:root{--bg:oklch(13% 0.008 60);--ink:oklch(90% 0.025 80);--dim:oklch(46% 0.018 70);--faint:oklch(30% 0.012 65);--accent:oklch(74% 0.13 58)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:880px;height:200px;overflow:hidden;background:transparent;font-family:Text;-webkit-font-smoothing:antialiased;color:var(--ink)}
.card{position:absolute;inset:0;border-radius:16px;overflow:hidden;padding:0 48px;display:flex;flex-direction:column;justify-content:center;
  background:
    radial-gradient(420px 260px at 88% 40%, oklch(74% 0.13 58 / .16), transparent 70%),
    var(--bg);
  box-shadow:inset 0 0 0 1px oklch(100% 0 0 / .07)}
.eye{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
h1{font-family:Display;font-weight:400;font-size:64px;line-height:1;letter-spacing:-.01em;margin-top:14px}
.hair{width:64px;height:3px;border-radius:2px;background:var(--accent);margin-top:18px}
</style></head><body>
<div class="card">
  <div class="eye">Copy &nbsp;·&nbsp; Paste &nbsp;·&nbsp; Approve</div>
  <h1>Prompt your agent</h1>
  <div class="hair"></div>
</div>
</body></html>
