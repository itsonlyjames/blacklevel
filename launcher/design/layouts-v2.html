<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>List and Split</title>
<style>
@font-face{font-family:Display;src:url(../app/assets/fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Text;src:url(../app/assets/fonts/HankenGrotesk.ttf);font-weight:100 900}
:root{
  --bg:oklch(13% 0.008 60);
  --ink:oklch(90% 0.025 80);
  --dim:oklch(46% 0.018 70);
  --faint:oklch(30% 0.012 65);
  --accent:oklch(74% 0.13 58);
  --page:oklch(17% 0.008 60);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:Text;-webkit-font-smoothing:antialiased;padding:56px 16px 120px}
header,main{max-width:1500px;margin:0 auto}
header{padding:0 4px 48px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 48px;align-items:end}
h1{font-family:Display;font-weight:400;font-size:64px;line-height:1}
header p{grid-column:1;color:var(--dim);font-size:17px;max-width:66ch;line-height:1.55}
header kbd{grid-column:2;grid-row:1/3;align-self:end;font:600 12px Text;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
@media (max-width:720px){header{grid-template-columns:1fr}header kbd{grid-column:1;grid-row:auto}}
section{margin-bottom:88px}
section > h2{font-family:Display;font-weight:400;font-size:40px;padding:0 4px 20px;display:flex;align-items:baseline;gap:16px}
section > h2 span{font:600 13px Text;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));gap:40px}
figure{min-width:0}
.tv{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px oklch(24% .01 60);cursor:pointer;outline:none;transition:box-shadow .3s}
.tv:focus-visible,.tv.active{box-shadow:0 0 0 1px oklch(24% .01 60),0 0 0 3px color-mix(in oklch,var(--accent) 55%,transparent)}
.screen{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
figcaption{padding:18px 4px 0;display:grid;gap:8px}
figcaption h3{font-size:18px;font-weight:600}
figcaption h3 b{color:var(--accent);font-weight:600;margin-right:8px}
figcaption p{color:var(--dim);font-size:15px;line-height:1.55;max-width:62ch}
figcaption ul{list-style:none;color:var(--dim);font-size:14px;line-height:1.55;display:grid;gap:3px}
figcaption li::before{content:"–";color:var(--faint);margin-right:10px}
.dpad{color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}

/* ---- inside a 1920x1080 screen ---- */
.abs{position:absolute}
.time{font-family:Display;line-height:.86;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.date{font-size:28px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mark::after{content:"";position:absolute;left:0;right:0;bottom:.1em;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;opacity:0;transition:transform .4s var(--ease),opacity .2s}
.mark.sel::after{transform:scaleX(1);opacity:1}

/* inputs: port label in small caps, then the device */
.inp{position:relative;font-size:40px;font-weight:500;color:var(--dim);white-space:nowrap;transition:color .3s;line-height:1.5}
.inp.sel{color:var(--ink)}
.inp .port{font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);transition:color .3s}
.inp.sel .port{color:var(--dim)}
.inp.util{font-size:32px}

/* list (B): every name is set at 128px and scaled, so focus moves without reflow */
.list{position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent 4%,#000 22%,#000 80%,transparent 97%);mask-image:linear-gradient(transparent 4%,#000 22%,#000 80%,transparent 97%)}
.li{position:absolute;left:0;top:0;font-family:Display;font-size:128px;line-height:1.12;white-space:nowrap;color:var(--dim);transform-origin:0 0;transition:transform .5s var(--ease),opacity .5s var(--ease),color .3s}
.li.sel{color:var(--ink)}
.li.mark::after{bottom:.06em}
.num{position:absolute;left:0;top:0;font-size:26px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--faint);transition:transform .5s var(--ease),opacity .5s var(--ease),color .3s}
.num.sel{color:var(--accent)}

/* grid (F) */
.grid{position:absolute;overflow:hidden}
.grid.more{-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.cell{position:absolute;left:0;top:0;font-family:Display;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);line-height:1.3;padding-bottom:.08em;transition:transform .45s var(--ease),color .3s,opacity .45s var(--ease)}
.cell.sel{color:var(--ink)}
.cell.mark::after{bottom:.04em;right:auto;width:var(--w)}
.away{opacity:.42}
.rowfade{transition:opacity .45s var(--ease)}
</style></head>
<body>
<header>
  <h1>List and Split</h1>
  <p>Second pass at B and F. Each one has two versions. Click a screen and use the arrow keys to move around it like the remote: OK is Enter, and on B2 the number keys work as well.</p>
  <kbd>Click a screen · ◀ ▶ ▲ ▼ · Enter</kbd>
</header>
<main>

<section>
  <h2>List <span>B</span></h2>
  <div class="pair">
    <figure><div class="tv" tabindex="0" data-layout="list"></div>
      <figcaption><h3><b>B1</b>List, refined</h3>
        <p>The focused app holds one spot at eye level and the list moves through it, getting smaller and fainter with distance. It works like today's row, turned on its side.</p>
        <ul><li>Names step down in size smoothly instead of jumping from big to small</li><li>Clock and inputs share one right edge, with the port label set before the device name so the edge stays clean</li><li>Customise and Settings set smaller, apart from the inputs</li><li>Moving to the inputs leaves the focused app in place, dimmed, so you can see where you came from</li></ul>
        <div class="dpad">▲ ▼ apps · ▶ inputs · ◀ back</div></figcaption></figure>
    <figure><div class="tv" tabindex="0" data-layout="index"></div>
      <figcaption><h3><b>B2</b>Index</h3>
        <p>Set like the contents page of a book. Every app gets a number in the margin, and the number keys on the Sony remote jump straight to it. The clock moves to the bottom right and the inputs line up along the top.</p>
        <ul><li>Numbers make it quick to find an app far down the list</li><li>The big clock in the corner doubles as the screensaver look when the screen dims</li><li>Inputs stay out of the way until you press ▶</li></ul>
        <div class="dpad">▲ ▼ apps · 1–9 jump · ▶ inputs</div></figcaption></figure>
  </div>
</section>

<section>
  <h2>Split <span>F</span></h2>
  <div class="pair">
    <figure><div class="tv" tabindex="0" data-layout="split"></div>
      <figcaption><h3><b>F1</b>Split, refined</h3>
        <p>Clock and inputs in a narrow column on the left, apps in two even columns on the right. No dividing line. The space between does that job, and a fixed line would be a burn-in risk.</p>
        <ul><li>Fixed column widths, so long names are cut with "…" instead of pushing the grid out of line</li><li>When there are more rows than fit, the grid scrolls and fades at the bottom</li><li>The side you're not using dims, so it's obvious which half you're in</li></ul>
        <div class="dpad">◀ ▶ ▲ ▼ in the grid · ◀ off the edge to inputs</div></figcaption></figure>
    <figure><div class="tv" tabindex="0" data-layout="shelf"></div>
      <figcaption><h3><b>F2</b>Shelf</h3>
        <p>Mirrored, with three columns: apps on the left where you start reading, and the clock and inputs on the right. Fourteen apps fit without scrolling, so nothing is ever hidden.</p>
        <ul><li>Smaller names, but still larger than the inputs</li><li>Rows sit on a fixed spacing that lines up with the input rail</li><li>The selected app's row lifts slightly while the others stay back</li></ul>
        <div class="dpad">◀ ▶ ▲ ▼ in the grid · ▶ off the edge to inputs</div></figcaption></figure>
  </div>
</section>

</main>
<script>
const APPS = ["Netflix","YouTube","SmartTube beta","Plex","Spotify","Kayo Sports","Binge","Prime Video","ABC iview","SBS On Demand","9Now","10play","7plus","Optus Sport"];
const INPUTS = [{label:"SHIELD",port:"HDMI 1"},{label:"PC",port:"HDMI 3"},{label:"HDMI 4"}];
const UTIL = ["Customise","Settings"];
const ALL_IN = INPUTS.concat(UTIL.map(l=>({label:l,util:true})));
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const inputHTML = x => `<div class="inp mark${x.util?' util':''}">${x.port?`<span class="port">${x.port}</span>&ensp;`:''}${x.label}</div>`;

/* ---------- B: list and index ---------- */
function makeList(screen, numbered){
  const S = [1,.5,.42,.38,.36,.36,.36], O = [1,.95,.74,.5,.28,.12,0], LH = 128*1.12, GAP = numbered ? 14 : 18;
  const ANCHOR = numbered ? 470 : 448, X = numbered ? 236 : 128;
  screen.innerHTML = '';
  const list = h(`<div class="list"></div>`); screen.append(list);
  const items = APPS.map((a,i)=>{ const e = h(`<div class="li mark">${a}</div>`); e.style.left = X+'px'; list.append(e); return e; });
  const nums = numbered ? APPS.map((a,i)=>{ const e = h(`<div class="num">${String(i+1).padStart(2,'0')}</div>`); e.style.left='128px'; list.append(e); return e; }) : [];

  let rail;
  if(!numbered){
    rail = h(`<div class="abs rowfade" style="right:128px;top:96px;bottom:150px;display:flex;flex-direction:column;align-items:flex-end;text-align:right">
      <div class="time" style="font-size:160px">7:42</div><div class="date" style="margin-top:24px">Saturday 31 October</div>
      <div style="margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        ${INPUTS.map(x=>inputHTML(x)).join('')}
        <div style="display:flex;gap:48px;margin-top:36px">${UTIL.map(l=>inputHTML({label:l,util:true})).join('')}</div>
      </div></div>`);
  } else {
    rail = h(`<div>
      <div class="abs rowfade ins" style="right:128px;top:96px;display:flex;gap:56px;align-items:baseline">
        ${INPUTS.map(x=>inputHTML(x)).join('')}<span style="width:8px"></span>${UTIL.map(l=>inputHTML({label:l,util:true})).join('')}
      </div>
      <div class="abs" style="right:128px;bottom:110px;text-align:right">
        <div class="date" style="margin-bottom:26px">Saturday 31 October</div><div class="time" style="font-size:300px">7:42</div>
      </div></div>`);
  }
  screen.append(rail);
  const ins = [...rail.querySelectorAll('.inp')];

  const st = {row:0, ai:0, ii:0};
  function render(){
    const y = []; y[st.ai] = ANCHOR;
    const s = i => S[Math.min(Math.abs(i-st.ai), S.length-1)];
    for(let i=st.ai+1;i<APPS.length;i++) y[i] = y[i-1] + LH*s(i-1) + GAP;
    for(let i=st.ai-1;i>=0;i--) y[i] = y[i+1] - LH*s(i) - GAP;
    items.forEach((e,i)=>{
      const d = Math.abs(i-st.ai);
      e.style.transform = `translateY(${y[i]}px) scale(${s(i)})`;
      e.style.opacity = O[Math.min(d,O.length-1)] * (st.row===1 && d===0 ? .55 : 1);
      e.classList.toggle('sel', d===0 && st.row===0);
      if(numbered){ nums[i].style.transform = `translateY(${y[i] + LH*s(i)*.6 - 18}px)`; nums[i].style.opacity = e.style.opacity; nums[i].classList.toggle('sel', d===0 && st.row===0); }
    });
    ins.forEach((e,i)=>e.classList.toggle('sel', st.row===1 && i===st.ii));
  }
  function key(k){
    if(st.row===0){
      if(k==='ArrowUp') st.ai=Math.max(0,st.ai-1);
      else if(k==='ArrowDown') st.ai=Math.min(APPS.length-1,st.ai+1);
      else if(k==='ArrowRight') st.row=1;
      else if(numbered && /^[1-9]$/.test(k)) st.ai=Math.min(APPS.length-1,+k-1);
      else return false;
    } else {
      const prev = numbered ? 'ArrowLeft' : 'ArrowUp', next = numbered ? 'ArrowRight' : 'ArrowDown';
      if(k===prev) { if(numbered && st.ii===0) st.row=0; else st.ii=Math.max(0,st.ii-1); }
      else if(k===next) st.ii=Math.min(ins.length-1,st.ii+1);
      else if(!numbered && k==='ArrowLeft') st.row=0;
      else if(!numbered && k==='ArrowRight' && st.ii>=INPUTS.length) st.ii=Math.min(ins.length-1,st.ii+1);
      else if(numbered && k==='ArrowDown') st.row=0;
      else return false;
    }
    render(); return true;
  }
  render(); return {key, render};
}

/* ---------- F: split and shelf ---------- */
function makeGrid(screen, mirrored){
  const COLS = mirrored ? 3 : 2, FS = mirrored ? 64 : 76, ROWH = mirrored ? 150 : 124, COLW = mirrored ? 380 : 470;
  const G = mirrored ? {left:128, top:150, w:COLS*COLW, h:5*ROWH} : {left:860, top:142, w:COLS*COLW, h:6*ROWH+20};
  const VIS = Math.floor(G.h/ROWH);
  screen.innerHTML = '';
  const grid = h(`<div class="grid rowfade"></div>`);
  Object.assign(grid.style,{left:G.left+'px',top:G.top+'px',width:G.w+'px',height:G.h+'px'});
  const cells = APPS.map(a=>{ const e = h(`<div class="cell mark">${a}</div>`); e.style.fontSize=FS+'px'; e.style.maxWidth=(COLW-56)+'px'; grid.append(e); return e; });
  screen.append(grid);

  const railX = mirrored ? 'right:128px;align-items:flex-end;text-align:right' : 'left:128px;align-items:flex-start';
  const rail = h(`<div class="abs rowfade" style="${railX};top:96px;bottom:150px;width:${mirrored?520:600}px;display:flex;flex-direction:column">
      <div class="time" style="font-size:${mirrored?150:184}px">7:42</div><div class="date" style="margin-top:24px">Saturday 31 October</div>
      <div class="ins rowfade" style="margin-top:auto;display:flex;flex-direction:column;align-items:inherit;gap:6px">
        ${INPUTS.map(x=>inputHTML(x)).join('')}
        <div style="display:flex;gap:48px;margin-top:36px">${UTIL.map(l=>inputHTML({label:l,util:true})).join('')}</div>
      </div></div>`);
  screen.append(rail);
  const ins = [...rail.querySelectorAll('.inp')];

  const st = {row:0, ai:0, ii:0, top:0};
  function render(){
    const r = Math.floor(st.ai/COLS);
    if(r < st.top) st.top = r; if(r > st.top+VIS-1) st.top = r-VIS+1;
    cells.forEach((e,i)=>{
      const cr = Math.floor(i/COLS), cc = i%COLS, lift = mirrored && st.row===0 && cr===r ? -6 : 0;
      e.style.transform = `translate(${cc*COLW}px,${(cr-st.top)*ROWH + lift}px)`;
      e.classList.toggle('sel', st.row===0 && i===st.ai);
      e.style.opacity = mirrored && st.row===0 && cr!==r ? .78 : 1;
    });
    const sel = cells[st.ai]; sel.style.setProperty('--w', Math.min(sel.scrollWidth, COLW-56)+'px');
    grid.classList.toggle('more', st.top + VIS < Math.ceil(APPS.length/COLS));
    grid.classList.toggle('away', st.row===1); rail.querySelector('.ins').classList.toggle('away', st.row===0);
    ins.forEach((e,i)=>e.classList.toggle('sel', st.row===1 && i===st.ii));
  }
  const toRail = mirrored ? 'ArrowRight' : 'ArrowLeft', fromRail = mirrored ? 'ArrowLeft' : 'ArrowRight';
  function key(k){
    const c = st.ai%COLS;
    if(st.row===0){
      if(k===toRail && c===(mirrored?COLS-1:0)) { st.row=1; st.ii=Math.min(INPUTS.length-1, Math.floor((st.ai/COLS - st.top)/VIS*INPUTS.length)); }
      else if(k==='ArrowLeft' && c>0) st.ai--;
      else if(k==='ArrowRight' && c<COLS-1 && st.ai<APPS.length-1) st.ai++;
      else if(k==='ArrowUp' && st.ai>=COLS) st.ai-=COLS;
      else if(k==='ArrowDown' && st.ai+COLS<APPS.length) st.ai+=COLS;
      else return k.startsWith('Arrow');
    } else {
      if(k===fromRail) st.row=0;
      else if(k==='ArrowUp') st.ii=Math.max(0,st.ii-1);
      else if(k==='ArrowDown') st.ii=Math.min(ins.length-1,st.ii+1);
      else if(k===toRail && st.ii===INPUTS.length) st.ii++;
      else return k.startsWith('Arrow');
    }
    render(); return true;
  }
  render(); return {key, render};
}

/* ---------- wiring ---------- */
const handlers = new Map();
document.querySelectorAll('.tv').forEach(tv=>{
  const screen = document.createElement('div'); screen.className = 'screen'; tv.append(screen);
  const L = tv.dataset.layout;
  handlers.set(tv, L==='list' ? makeList(screen,false) : L==='index' ? makeList(screen,true) : makeGrid(screen, L==='shelf'));
  tv.addEventListener('focus', ()=>{ document.querySelectorAll('.tv').forEach(t=>t.classList.toggle('active', t===tv)); });
  tv.addEventListener('keydown', e=>{ const k = e.key==='Enter' ? null : e.key; if(k && handlers.get(tv).key(k)) e.preventDefault(); });
});
const fit = () => document.querySelectorAll('.tv').forEach(tv => tv.firstElementChild.style.transform = `scale(${tv.clientWidth/1920})`);
addEventListener('resize', fit); fit(); document.fonts.ready.then(()=>{ fit(); handlers.forEach(x=>x.render()); });
</script>
</body></html>
