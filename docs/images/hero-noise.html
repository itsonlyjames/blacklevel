<!doctype html>
<html><head><meta charset="utf-8">
<!-- README hero, "noise to black": a busy grid of tiles switching off, pixel by pixel, into one quiet row in Home's type.
     Render: brave/chrome --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=880,400 --default-background-color=00000000 --screenshot=hero-noise.png hero-noise.html
     Keep it PNG (WebP bands the gradients). -->
<style>
@font-face{font-family:Display;src:url(../../launcher/app/assets/fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Text;src:url(../../launcher/app/assets/fonts/HankenGrotesk.ttf);font-weight:100 900}
:root{--bg:oklch(9% 0.006 60);--ink:oklch(90% 0.025 80);--dim:oklch(46% 0.018 70);--faint:oklch(24% 0.01 65);--accent:oklch(74% 0.13 58)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:880px;height:400px;overflow:hidden;background:transparent;font-family:Text;-webkit-font-smoothing:antialiased;color:var(--ink)}
.card{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px oklch(100% 0 0 / .07)}
/* the noise: tiles placed by the script below */
.noise{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,#000 16%,transparent 54%)}
.noise b{position:absolute;border-radius:3px}
/* the quiet side, in Home's own type at .38 of its 1080p sizes, so the proportions are the real ones:
   time 184 / date 30 / apps 100 with a 72 gap and a 4px focus bar */
.quiet{position:absolute;left:520px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.time{font-family:Display;font-size:70px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.date{margin:10px 0 0 2px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
/* the dial runs off the edge, as it does on the TV */
.row{display:flex;align-items:baseline;gap:27px;width:330px;margin-top:46px;overflow:hidden;font-family:Display;font-size:38px;line-height:1.5;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 90px),transparent)}
.row span{color:var(--dim)}
.row span:first-child{color:var(--ink)}
.row span:first-child::after{content:"";display:block;height:2px;margin-top:-5px;border-radius:1px;background:var(--accent)}
.brand{position:absolute;left:521px;bottom:30px;display:flex;align-items:center;gap:9px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.brand i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
</style></head><body>
<div class="card">
  <div class="noise"></div>
  <div class="quiet">
    <div class="time">6:35</div>
    <div class="date">Monday 2 November</div>
    <div class="row"><span>Netflix</span><span>YouTube</span><span>Plex</span><span>Spotify</span></div>
  </div>
  <div class="brand"><i></i>Blacklevel</div>
</div>
<script>
// a seeded shuffle, so every render is the same picture
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const noise = document.querySelector('.noise');
const tile = (x, y, w, h, bg, extra = '') => {
  // tiles go out from left to right: fainter, then switched off, like an OLED dropping pixels
  const t = Math.min(1, Math.max(0, (x - 60) / 380));
  if(rnd() < t * 1.15) return;
  const b = document.createElement('b');
  b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};opacity:${(1 - t * .85).toFixed(2)};${extra}`;
  noise.appendChild(b);
};
const grey = () => `oklch(${(24 + rnd() * 16).toFixed(1)}% ${(rnd() * .02).toFixed(3)} ${Math.round(rnd() * 360)})`;
const loud = () => `oklch(${(38 + rnd() * 12).toFixed(1)}% ${(.05 + rnd() * .05).toFixed(3)} ${[25, 250, 145, 300][Math.floor(rnd() * 4)]})`;
// a hero banner, then rows of thumbnails with their title bars, badges and the odd loud tile
tile(28, 28, 280, 100, 'linear-gradient(110deg, oklch(34% .05 250), oklch(26% .03 300))');
tile(44, 92, 90, 8, 'oklch(55% .01 80)'); tile(44, 106, 56, 14, 'oklch(62% .12 25)', 'border-radius:7px');
tile(316, 28, 136, 100, grey()); tile(460, 28, 136, 100, grey());
let y = 156;
for(const h of [40, 34, 40, 34, 40]){
  for(let x = 28; x < 620; x += 72 + Math.round(rnd() * 6)){
    tile(x, y, 64, h, rnd() < .18 ? loud() : grey());
    tile(x, y + h + 5, 40 + rnd() * 40, 4, 'oklch(32% .006 70)');
    if(rnd() < .25) tile(x + 5, y + 5, 18, 7, loud(), 'border-radius:5px');
  }
  y += h + 16;
}
</script>
</body></html>
